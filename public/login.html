<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login · Unsaid by Heart</title>

<style>

body {
  margin: 0;
  font-family: Georgia, serif;
  background-color: #F7EDE4;

  display: flex;
  justify-content: center;
  align-items: center;

  height: 100vh;
}

/* FORM BOX */
form {
  width: 340px;
  background: rgba(255,255,255,0.6);
  padding: 30px;
  border-radius: 12px;

  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

/* TITLE */
h2 {
  text-align: center;
  color: #6B4E3D;
  margin-bottom: 20px;
}

/* INPUTS */
input {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;

  font-size: 1rem;

  border: 1px solid #6B4E3D;
  border-radius: 6px;

  outline: none;
  font-family: Georgia, serif;
}

/* BUTTON COMMON */
button {
  width: 100%;
  padding: 10px;

  font-size: 1rem;

  border: none;
  border-radius: 6px;

  cursor: pointer;
  margin-bottom: 10px;
}

/* LOGIN BUTTON */
.login-btn {
  background: #6B4E3D;
  color: white;
}

.login-btn:hover {
  background: #5A4030;
}

/* GOOGLE BUTTON */
.google-btn {
  background: #db4437;
  color: white;
}

.google-btn:hover {
  background: #b3362a;
}

/* MESSAGE */
.msg {
  text-align: center;
  color: red;
  font-size: 0.9rem;
}

</style>
</head>

<body>

<form>
  <h2>Login</h2>

  <input id="email" type="email" placeholder="Email" required>
  <input id="password" type="password" placeholder="Password" required>

  <button 
   type="button"
    onclick=window.location.href="/auth/google";>
    Login with Google
  </button>

  <div class="msg" id="msg"></div>
</form>

<script>
document.querySelector("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (!res.ok) {
    document.getElementById("msg").innerText = data.message || "Login failed";
    return;
  }

  localStorage.setItem("token", data.token);
  window.location.href = "poems.html";
});
</script>

</body>
</html>
